name: Theme and splash authoring checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - run: python tools/update_splash_manifest.py --check
      - run: python tools/update_theme_manifest.py --check
      - if: runner.os == 'Linux'
        run: |
          export GLOAM_STUDIO_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          xvfb-run -a python -m unittest discover -s tests -p 'test_*.py'
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/pack_splash.py --help
      - run: python tools/theme_builder.py --help
