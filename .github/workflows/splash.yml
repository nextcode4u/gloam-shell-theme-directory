name: Splash Builder checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/update_splash_manifest.py --check
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_*.py'
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/pack_splash.py --help
