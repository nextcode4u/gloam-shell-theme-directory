[theme]
version=2
name=Classic DS
header=Classic DS

[colors]
background=#f0f1ee
surface=#eff1ee
line=#636b6e
text=#252b2d
muted=#61696d
accent=#547e92
ink=#fbfcfa
selection_text=#252b2d
tab_text=#252b2d

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=journal
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=icons
tab_highlight=skin
tab_visible=5
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3
tabs_position=bottom

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

