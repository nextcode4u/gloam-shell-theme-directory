[theme]
version=2
name=Classic DS
header=Classic DS

[colors]
background=#e9edf0
surface=#f8f8f2
line=#84939f
text=#25343e
muted=#586a79
accent=#eb9426
ink=#221e17
selection_text=#221e17
tab_text=#221e17

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=gallery
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=icons
tab_highlight=skin
tab_visible=5
tab_gap=4
view=grid
icon_size=large
row_padding=2
large_grid_columns=3
tabs_position=top

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

