[theme]
version=2
name=Aero Glass
header=Aero Glass

[colors]
background=#d3e5ed
surface=#e4f6fc
line=#6dacc5
text=#15334a
muted=#456878
accent=#2072a3
ink=#ffffff
selection_text=#ffffff
tab_text=#ffffff

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=spotlight
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=icons
tab_highlight=skin
tab_visible=5
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3
tabs_position=bottom

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=18
focus=off

[assets]
prepared=assets.gfx

