[theme]
version=2
header=NIGHTLINE
name=Slate

[colors]
background=#101820
surface=#20303c
line=#405060
text=#ecf1f5
muted=#abc0cf
accent=#8dbce8
ink=#14202b

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[layout]
tab_style=icons
tab_highlight=skin
tab_visible=3
tab_gap=4
top_layout=sidebar_left
chrome=minimal
content_opacity=78
top_content_opacity=100
bottom_content_opacity=100
view=extended
icon_size=small
row_padding=2

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[motion]
ambient=motion/ambient.gtm
ambient_ticks=14
focus=off

[assets]
prepared=assets.gfx
