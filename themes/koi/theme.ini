[theme]
version=2
name=Koi
header=Koi

[colors]
background=#101a2a
surface=#18283c
line=#58657a
text=#f6eddb
muted=#bbbec7
accent=#f1a18a
ink=#291b21

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=gallery
chrome=minimal
content_opacity=46
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
view=classic
icon_size=large
row_padding=2
large_grid_columns=3
tabs_position=top
top_content_opacity=100
bottom_content_opacity=100

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=20
focus=pulse

[assets]
prepared=assets.gfx
