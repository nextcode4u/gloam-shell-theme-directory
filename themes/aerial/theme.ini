[theme]
version=2
name=Aerial
header=Aerial

[colors]
background=#e5ebef
surface=#f6f9fa
line=#95a8b5
text=#172d3d
muted=#4a626f
accent=#285a79
ink=#ffffff

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=spotlight
chrome=minimal
content_opacity=74
tab_style=icons
tab_highlight=underline
tab_visible=5
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3
scene_cover_x=18
scene_cover_y=38
scene_cover_width=44
scene_cover_height=66
top_content_opacity=100
bottom_content_opacity=100
tabs_position=bottom

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=pulse

[assets]
prepared=assets.gfx
