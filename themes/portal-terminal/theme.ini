[theme]
version=2
name=Portal Terminal
header=Portal Terminal

[colors]
background=#fff4d6
surface=#fff4d6
line=#373247
text=#252838
muted=#57485e
accent=#50316b
ink=#fff4d6
selection_text=#252838
tab_text=#252838

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=scene
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3
scene_cover_x=18
scene_cover_y=38
scene_cover_width=44
scene_cover_height=66

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

