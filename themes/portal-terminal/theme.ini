[theme]
version=2
name=Portal Terminal
header=Portal Terminal

[colors]
background=#152c2c
surface=#203c3b
line=#749873
text=#eff9cf
muted=#adcbaf
accent=#b8ec4b
ink=#172521
selection_text=#172521
tab_text=#172521

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=poster
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=icons
tab_highlight=skin
tab_visible=5
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

