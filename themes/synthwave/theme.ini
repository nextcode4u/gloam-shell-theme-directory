[theme]
version=2
name=Synthwave
header=Synthwave

[colors]
background=#2a2139
surface=#34294f
line=#675581
text=#f4eee4
muted=#c5bfdb
accent=#ff7edb
ink=#241b2f
selection_text=#241b2f
tab_text=#241b2f

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=scene
chrome=minimal
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=pager
tab_highlight=skin
tab_visible=3
tab_gap=4
view=shelf
icon_size=large
row_padding=2
large_grid_columns=3
scene_cover_x=18
scene_cover_y=38
scene_cover_width=44
scene_cover_height=66

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

