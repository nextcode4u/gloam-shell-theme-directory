[theme]
version=2
name=Synthwave
header=Synthwave

[colors]
background=#181c39
surface=#242544
line=#76627f
text=#f8e8df
muted=#c7b7d5
accent=#f5ad7d
ink=#201c30
selection_text=#201c30
tab_text=#201c30

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=scene
chrome=minimal
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=pager
tab_highlight=skin
tab_visible=3
tab_gap=4
view=shelf
icon_size=large
row_padding=2
large_grid_columns=3
scene_cover_x=18
scene_cover_y=38
scene_cover_width=44
scene_cover_height=66

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

