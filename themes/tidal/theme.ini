[theme]
version=2
name=Tidal
header=Tidal

[colors]
background=#061f2c
surface=#123746
line=#427785
text=#e7fcf4
muted=#a2c7cc
accent=#89e2d9
ink=#0a3038

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=poster
chrome=minimal
content_opacity=48
tab_style=icons
tab_highlight=skin
tab_visible=5
tab_gap=4
view=grid
icon_size=large
row_padding=2
large_grid_columns=3
top_content_opacity=100
bottom_content_opacity=100

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=16
focus=off

[assets]
prepared=assets.gfx
