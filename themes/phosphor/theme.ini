[theme]
version=2
header=PHOSPHOR RADAR
name=Phosphor

[colors]
background=#07100b
surface=#11251a
line=#385b42
text=#e5ffe9
muted=#96bfa2
accent=#91ed99
ink=#09200e

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=numbered
tab_highlight=outline
tab_visible=3
tab_gap=4
top_layout=sidebar
chrome=full
content_opacity=85
view=classic
icon_size=small
row_padding=0
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[icons]
directory=icons

[components]
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=pulse

[assets]
prepared=assets.gfx
