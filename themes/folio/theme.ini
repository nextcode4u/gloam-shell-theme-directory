[theme]
version=2
header=FIELD NOTES
name=Folio

[colors]
background=#eeece2
surface=#d5d3c8
line=#9b9b90
text=#202520
muted=#5d655d
accent=#303b33
ink=#fafbf3

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=labels
tab_highlight=underline
tab_visible=3
tab_gap=4
top_layout=journal
chrome=minimal
content_opacity=82
view=list
icon_size=small
row_padding=2
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100
tabs_position=top

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[motion]
ambient=motion/ambient.gtm
ambient_ticks=22
focus=off

[assets]
prepared=assets.gfx
