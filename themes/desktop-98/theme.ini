[theme]
version=2
name=Desktop 98
header=Desktop 98

[colors]
background=#c0c0c0
surface=#c0c0c0
line=#636363
text=#101010
muted=#3c3c3c
accent=#000080
ink=#ffffff
selection_text=#ffffff
tab_text=#ffffff
header_text=#ffffff
header_link_text=#ffffff

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=sidebar_left
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
view=classic
icon_size=small
row_padding=2
large_grid_columns=3

[backgrounds]
strength=100

[icons]
directory=icons

[components]
directory=components
border=4
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

