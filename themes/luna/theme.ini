[theme]
version=2
name=Luna XP
header=Luna XP

[colors]
background=#ece9d8
surface=#fffefb
line=#7f9db9
text=#152943
muted=#536b86
accent=#245edb
ink=#ffffff
selection_text=#ffffff
tab_text=#ffffff
header_text=#ffffff
footer_text=#ffffff
header_link_text=#ffffff

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=sidebar
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
view=classic
icon_size=small
row_padding=0
large_grid_columns=3

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

