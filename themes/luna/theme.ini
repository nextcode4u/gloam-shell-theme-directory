[theme]
version=2
name=Luna XP
header=Luna XP

[colors]
background=#dce9fc
surface=#f1f4ed
line=#5378a8
text=#172a4a
muted=#536378
accent=#235ed4
ink=#fffdf1
selection_text=#fffdf1
tab_text=#fffdf1

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=spotlight
chrome=full
content_opacity=100
top_content_opacity=100
bottom_content_opacity=100
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3
tabs_position=bottom

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/focus-material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx

