[theme]
version=2
name=Morrow
header=Morrow

[colors]
background=#f3e8d7
surface=#fff6e8
line=#b6a58d
text=#3a3029
muted=#776249
accent=#70503a
ink=#fff7e8

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
top_layout=journal
chrome=minimal
content_opacity=80
tab_style=numbered
tab_highlight=underline
tab_visible=3
tab_gap=4
view=extended
icon_size=large
row_padding=2
large_grid_columns=3
scene_cover_x=18
scene_cover_y=38
scene_cover_width=44
scene_cover_height=66
tabs_position=bottom
top_content_opacity=100
bottom_content_opacity=100

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.png
strength=100
top_surface=backgrounds/material-top.png
bottom_surface=backgrounds/material-bottom.png

[icons]
directory=icons

[components]
directory=components
border=6
alpha=coverage
controls=on
fill=stretch
material=components/material.png
focus_material=components/material.png

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[motion]
ambient=motion/ambient.gtm
ambient_ticks=12
focus=off

[assets]
prepared=assets.gfx
